name: Staging visual release check

on:
  push:
    branches: [main]
    paths:
      - "scripts/staging_visual_smoke.mjs"
      - ".github/workflows/staging-visual-release-check.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaeo-staging-visual-release-check
  cancel-in-progress: true

jobs:
  visual-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Wait for current staging
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..18}; do
            if curl -fsS --max-time 15 https://gaeo-ru.github.io/ >/dev/null; then
              echo "Staging is reachable."
              exit 0
            fi
            sleep 10
          done
          exit 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright
        run: |
          npm install --no-save playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Run desktop/mobile visual smoke test
        env:
          GAEO_STAGING_ORIGIN: https://gaeo-ru.github.io
        run: node scripts/staging_visual_smoke.mjs

      - name: Upload visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaeo-staging-visual-smoke
          path: visual-smoke/
          retention-days: 14
