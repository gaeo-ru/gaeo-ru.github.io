name: Optimize local images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/optimize-images.yml"
      - "scripts/optimize_local_images.py"

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Optimize local images and HTML attributes
        run: python scripts/optimize_local_images.py
      - name: Commit optimization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Optimize local images and loading attributes"
          git pull --rebase origin main
          git push origin HEAD:main
