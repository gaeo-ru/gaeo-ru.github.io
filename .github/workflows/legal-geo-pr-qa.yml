name: Industry GEO cluster PR quality checks
on:
  pull_request:
    branches: [astro-source]
    paths:
      - 'src/legacy/pages/industries/**'
      - 'src/legacy/pages/strategies/**'
      - 'src/legacy/pages/articles/**'
      - 'src/legacy/pages/en/articles/**'
      - 'src/legacy/pages/en/industries/**'
      - 'src/legacy/pages/en/strategies/**'
      - 'src/legacy/pages/cases/**'
      - 'src/legacy/pages/en/cases/**'
      - 'src/legacy/pages/services/**'
      - 'src/legacy/pages/en/services/**'
      - 'src/legacy/pages/index.html'
      - 'src/legacy/pages/en/index.html'
      - 'scripts/qa_site_development_service.mjs'
      - 'public/assets/site-development.css'
      - 'templates/partials/site-footer.html'
      - 'templates/partials/site-footer-en.html'
      - 'scripts/qa_development_cases.mjs'
      - 'src/data/industry-commercial-pages.mjs'
      - 'src/components/**'
      - 'scripts/qa_legal_link_graph.mjs'
      - 'scripts/qa_industrial_link_graph.mjs'
      - 'public/assets/articles/industrial-steel-evidence.svg'
      - 'scripts/astro-industry-browser-qa.mjs'
      - 'public/assets/internal.css'
      - 'templates/partials/site-header.html'
      - 'templates/partials/site-header-en.html'
      - 'public/assets/style.css'
      - 'public/assets/site.js'
      - 'scripts/astro-parity.mjs'
      - 'scripts/site_qa.py'
      - '.github/workflows/astro-production.yml'
      - '.github/workflows/legal-geo-pr-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legal-geo-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node scripts/qa_editorial_contrasts.mjs
      - run: npm run build
      - run: npm run check:parity
      - run: npm run check:anchors
      - run: node scripts/qa_ecommerce_link_graph.mjs
      - run: node scripts/qa_legal_link_graph.mjs
      - run: node scripts/qa_industrial_link_graph.mjs
      - run: npx playwright install chromium
      - run: node scripts/qa_development_cases.mjs
      - run: node scripts/qa_site_development_service.mjs
      - run: npm run check:industry
