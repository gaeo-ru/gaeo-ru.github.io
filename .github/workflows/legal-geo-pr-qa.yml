name: Industry GEO cluster PR quality checks
on:
  pull_request:
    branches: [astro-source]
    paths:
      - 'src/legacy/pages/industries/**'
      - 'src/legacy/pages/strategies/**'
      - 'src/legacy/pages/articles/**'
      - 'src/legacy/pages/en/articles/**'
      - 'src/legacy/pages/en/industries/**'
      - 'src/legacy/pages/en/strategies/**'
      - 'src/legacy/pages/cases/**'
      - 'src/legacy/pages/en/cases/**'
      - 'src/legacy/pages/services/**'
      - 'src/legacy/pages/en/services/**'
      - 'src/legacy/pages/publications/**'
      - 'src/legacy/pages/en/publications/**'
      - 'src/legacy/pages/reviews/**'
      - 'src/legacy/pages/en/reviews/**'
      - 'src/data/publications.json'
      - 'src/data/reviews.json'
      - 'src/lib/evidence.mjs'
      - 'scripts/generate-evidence-pages.mjs'
      - 'scripts/qa_evidence_pages.mjs'
      - 'public/assets/evidence.css'
      - 'public/assets/review-carousel.css'
      - 'public/assets/review-carousel.js'
      - 'src/legacy/pages/index.html'
      - 'src/legacy/pages/en/index.html'
      - 'scripts/qa_site_development_service.mjs'
      - 'public/assets/site-development.css'
      - 'templates/partials/site-footer.html'
      - 'templates/partials/site-footer-en.html'
      - 'scripts/qa_development_cases.mjs'
      - 'scripts/qa_approved_design_system.mjs'
      - 'src/lib/approved-design-system.mjs'
      - 'src/lib/legacy.mjs'
      - 'src/data/approved-design-content.mjs'
      - 'src/data/preexisting-legacy-routes.mjs'
      - 'src/data/industry-commercial-pages.mjs'
      - 'src/data/pricing.mjs'
      - 'src/data/service-detail-content.mjs'
      - 'src/data/industry-catalog.mjs'
      - 'src/data/industry-specializations.mjs'
      - 'src/data/industry-clusters-phase-3a.mjs'
      - 'scripts/qa_sector_clusters_3a.mjs'
      - 'src/data/industry-methods-phase-3b.mjs'
      - 'scripts/qa_sector_methods_3b.mjs'
      - 'src/data/industry-specializations-batch-*.mjs'
      - 'scripts/qa_industry_specializations.mjs'
      - 'src/legacy/pages/tarify/**'
      - 'src/legacy/pages/en/pricing/**'
      - 'public/assets/tariffs/**'
      - 'public/assets/tariffs.css'
      - 'public/assets/tariffs.js'
      - 'public/assets/industry-catalog.css'
      - 'public/assets/industry-catalog.js'
      - 'scripts/generate-tariff-pages.mjs'
      - 'scripts/sync-service-feed.mjs'
      - 'scripts/qa_tariffs.mjs'
      - 'public/gaeo-services.yml.xml'
      - 'src/components/**'
      - 'scripts/qa_legal_link_graph.mjs'
      - 'scripts/qa_industrial_link_graph.mjs'
      - 'public/assets/articles/industrial-steel-evidence.svg'
      - 'scripts/astro-industry-browser-qa.mjs'
      - 'public/assets/internal.css'
      - 'templates/partials/site-header.html'
      - 'templates/partials/site-header-en.html'
      - 'public/assets/style.css'
      - 'public/assets/site.js'
      - 'scripts/astro-parity.mjs'
      - 'scripts/site_qa.py'
      - '.github/workflows/astro-production.yml'
      - '.github/workflows/legal-geo-pr-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: legal-geo-pr-direct-browser-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: node scripts/qa_editorial_contrasts.mjs
      - run: npm run build
      - run: npm run check:parity
      - run: npm run check:anchors
      - run: npm run check:design
      - run: node scripts/qa_ecommerce_link_graph.mjs
      - run: node scripts/qa_legal_link_graph.mjs
      - run: node scripts/qa_industrial_link_graph.mjs
      - run: npx playwright install chromium
      - run: npm run check:evidence
      - run: npm run check:tariffs
      - run: npm run check:specializations
      - run: npm run check:sector3a
      - run: node scripts/qa_development_cases.mjs
      - run: node scripts/qa_site_development_service.mjs
      - run: npm run check:industry
      - run: npm run check:research
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: geo-research-visual-checks
          path: |
            visual-evidence/
            visual-research/
            visual-tariffs/
            visual-industry/
          if-no-files-found: ignore
          retention-days: 7
