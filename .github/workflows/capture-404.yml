name: Capture 404 QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/capture-404.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages
        run: sleep 10
      - name: Capture desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser)"
          echo "BROWSER=$browser"
          url="https://gaeo-ru.github.io/this-page-does-not-exist-404-check-20260921/"
          "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=404-desktop.png "$url"
          "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=404-mobile.png "$url"
          file 404-desktop.png 404-mobile.png
      - uses: actions/upload-artifact@v4
        with:
          name: 404-qa-screenshots
          path: |
            404-desktop.png
            404-mobile.png
          if-no-files-found: error
