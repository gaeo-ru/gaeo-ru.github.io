name: Sostav IndexResearch authentication test

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  issues: write

concurrency:
  group: sostav-indexresearch-auth-test
  cancel-in-progress: false

jobs:
  auth-test:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.title == '[AUTH-TEST] Sostav IndexResearch' && github.event.issue.user.login == 'alexyakovlev79') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that both secrets exist
        id: secrets
        shell: bash
        env:
          AUTH_LOGIN: ${{ secrets.SOSTAV_INDEXRESEARCH_LOGIN }}
          AUTH_PASSWORD: ${{ secrets.SOSTAV_INDEXRESEARCH_PASSWORD }}
        run: |
          if [ -n "$AUTH_LOGIN" ] && [ -n "$AUTH_PASSWORD" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            printf '{"status":"MISSING_SECRETS","stage":"configuration"}\n' > auth_result.json
          fi

      - name: Set up Python
        if: steps.secrets.outputs.ready == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Playwright and Chromium
        if: steps.secrets.outputs.ready == 'yes'
        run: |
          python -m pip install --disable-pip-version-check playwright==1.56.0
          python -m playwright install --with-deps chromium

      - name: Check authorization once
        id: auth
        if: steps.secrets.outputs.ready == 'yes'
        continue-on-error: true
        env:
          SOSTAV_INDEXRESEARCH_LOGIN: ${{ secrets.SOSTAV_INDEXRESEARCH_LOGIN }}
          SOSTAV_INDEXRESEARCH_PASSWORD: ${{ secrets.SOSTAV_INDEXRESEARCH_PASSWORD }}
        run: python .github/gaeo-auth/sostav_indexresearch_auth_test.py

      - name: Publish safe status to workflow summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          statuses = {
              'AUTHENTICATED_INDEXRESEARCH', 'AUTHENTICATED_PROFILE_UNVERIFIED',
              'MISSING_SECRETS', 'ACCESS_BLOCKED', 'SITE_UNAVAILABLE',
              'CAPTCHA_REQUIRED', 'LOGIN_FORM_NOT_FOUND', 'LOGIN_FIELD_NOT_FOUND',
              'UNTRUSTED_LOGIN_DESTINATION', 'LOGIN_FIELDS_NOT_EDITABLE',
              'LOGIN_SUBMIT_FAILED', 'CREDENTIALS_REJECTED', 'PROFILE_UNAVAILABLE',
              'AUTHENTICATION_NOT_CONFIRMED', 'UNEXPECTED_ERROR',
          }
          try:
              status = json.loads(Path('auth_result.json').read_text())['status']
              if status not in statuses:
                  status = 'INTERNAL_ERROR'
          except Exception:
              status = 'INTERNAL_ERROR'
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Sostav IndexResearch login test: **' + status + '**\n')
          print('SAFE_STATUS=' + status)
          PY

      - name: Report status in triggering issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const allowed = new Set([
              'AUTHENTICATED_INDEXRESEARCH', 'AUTHENTICATED_PROFILE_UNVERIFIED',
              'MISSING_SECRETS', 'ACCESS_BLOCKED', 'SITE_UNAVAILABLE',
              'CAPTCHA_REQUIRED', 'LOGIN_FORM_NOT_FOUND', 'LOGIN_FIELD_NOT_FOUND',
              'UNTRUSTED_LOGIN_DESTINATION', 'LOGIN_FIELDS_NOT_EDITABLE',
              'LOGIN_SUBMIT_FAILED', 'CREDENTIALS_REJECTED', 'PROFILE_UNAVAILABLE',
              'AUTHENTICATION_NOT_CONFIRMED', 'UNEXPECTED_ERROR',
            ]);
            let status = 'INTERNAL_ERROR';
            try {
              const result = JSON.parse(fs.readFileSync('auth_result.json', 'utf8'));
              if (allowed.has(result.status)) status = result.status;
            } catch (_) {}
            const url = context.serverUrl + '/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: 'Sostav IndexResearch authentication check: **' + status +
                '**\n\nWorkflow run: ' + url +
                '\n\nNo passwords, cookies or browser-session files were saved.',
            });

      - name: Fail if not verified
        if: always() && (steps.secrets.outputs.ready != 'yes' || steps.auth.outcome != 'success')
        run: exit 1
