name: Sostav IndexResearch authentication test

on:
  workflow_dispatch:
  issues:
    types: [opened, edited]

permissions:
  contents: read
  issues: write

concurrency:
  group: sostav-indexresearch-auth-test
  cancel-in-progress: false

jobs:
  auth-test:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event_name == 'issues' && github.event.issue.title == '[AUTH-TEST] Sostav IndexResearch' && github.event.issue.user.login == 'alexyakovlev79') }}
    runs-on: ubuntu-24.04
    container:
      image: mcr.microsoft.com/playwright/python:v1.56.0-noble
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check that both secrets exist
        if: ${{ !contains(github.event.issue.body, '[AUTH-DIAG-NO-SECRETS]') }}
        id: secrets
        shell: bash
        env:
          AUTH_LOGIN: ${{ secrets.SOSTAV_INDEXRESEARCH_LOGIN }}
          AUTH_PASSWORD: ${{ secrets.SOSTAV_INDEXRESEARCH_PASSWORD }}
        run: |
          if [ -n "$AUTH_LOGIN" ] && [ -n "$AUTH_PASSWORD" ]; then
            echo "ready=yes" >> "$GITHUB_OUTPUT"
          else
            echo "ready=no" >> "$GITHUB_OUTPUT"
            printf '{"status":"MISSING_SECRETS","stage":"configuration"}\n' > auth_result.json
          fi

      - name: Install Python Playwright client (browsers supplied by pinned container)
        if: steps.secrets.outputs.ready == 'yes' || contains(github.event.issue.body, '[AUTH-DIAG-NO-SECRETS]')
        run: python -m pip install --disable-pip-version-check playwright==1.56.0

      - name: Diagnose public login UI without secrets
        if: contains(github.event.issue.body, '[AUTH-DIAG-NO-SECRETS]')
        run: python .github/gaeo-auth/sostav_indexresearch_auth_test.py --diagnose

      - name: Check authorization once
        id: auth
        if: steps.secrets.outputs.ready == 'yes'
        continue-on-error: true
        env:
          SOSTAV_INDEXRESEARCH_LOGIN: ${{ secrets.SOSTAV_INDEXRESEARCH_LOGIN }}
          SOSTAV_INDEXRESEARCH_PASSWORD: ${{ secrets.SOSTAV_INDEXRESEARCH_PASSWORD }}
        run: python .github/gaeo-auth/sostav_indexresearch_auth_test.py

      - name: Publish safe status to workflow summary
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          statuses = {
              'AUTHENTICATED_INDEXRESEARCH', 'AUTHENTICATED_PROFILE_UNVERIFIED',
              'MISSING_SECRETS', 'ACCESS_BLOCKED', 'SITE_UNAVAILABLE',
              'CAPTCHA_REQUIRED', 'LOGIN_FORM_NOT_FOUND', 'LOGIN_FIELD_NOT_FOUND',
              'UNTRUSTED_LOGIN_DESTINATION', 'LOGIN_FIELDS_NOT_EDITABLE',
              'LOGIN_SUBMIT_FAILED', 'SUBMIT_DISABLED_AFTER_FILL', 'CREDENTIALS_REJECTED', 'PROFILE_UNAVAILABLE',
              'AUTHENTICATION_NOT_CONFIRMED', 'UNEXPECTED_ERROR', 'DIAGNOSTICS_COMPLETE',
          }
          try:
              status = json.loads(Path('auth_result.json').read_text())['status']
              if status not in statuses:
                  status = 'INTERNAL_ERROR'
          except Exception:
              status = 'INTERNAL_ERROR'
          with open(__import__('os').environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write('Sostav IndexResearch login test: **' + status + '**\n')
          print('SAFE_STATUS=' + status)
          PY

      - name: Report status in triggering issue
        if: always() && github.event_name == 'issues'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const allowed = new Set([
              'AUTHENTICATED_INDEXRESEARCH', 'AUTHENTICATED_PROFILE_UNVERIFIED',
              'MISSING_SECRETS', 'ACCESS_BLOCKED', 'SITE_UNAVAILABLE',
              'CAPTCHA_REQUIRED', 'LOGIN_FORM_NOT_FOUND', 'LOGIN_FIELD_NOT_FOUND',
              'UNTRUSTED_LOGIN_DESTINATION', 'LOGIN_FIELDS_NOT_EDITABLE',
              'LOGIN_SUBMIT_FAILED', 'SUBMIT_DISABLED_AFTER_FILL', 'CREDENTIALS_REJECTED', 'PROFILE_UNAVAILABLE',
              'AUTHENTICATION_NOT_CONFIRMED', 'UNEXPECTED_ERROR', 'DIAGNOSTICS_COMPLETE',
            ]);
            let status = 'INTERNAL_ERROR';
            let signals = '';
            let stage = '';
            try {
              const result = JSON.parse(fs.readFileSync('auth_result.json', 'utf8'));
              if (allowed.has(result.status)) status = result.status;
              const allowedStages = new Set(['configuration', 'home', 'pre_login', 'login_form',
                'diagnostics', 'filled_form', 'profile_entry', 'register_entry', 'alternate_entry', 'post_submit', 'submit', 'profile', 'runtime']);
              if (allowedStages.has(result.stage)) stage = result.stage;
              const keys = [
                'home_login_text', 'home_login_locator', 'home_password', 'home_frame', 'home_body_login_word',
                'home_after_login_text', 'home_after_login_locator', 'home_after_password', 'home_after_frame', 'home_after_body_login_word',
                'profile_login_text', 'profile_login_locator', 'profile_password', 'profile_frame', 'profile_body_login_word',
                'register_after_login_text', 'register_after_login_locator', 'register_after_password',
                'register_after_frame', 'register_after_body_login_word'
              ];
              keys.push('login_modal_visible', 'native_toggle_visible', 'native_form_visible', 'native_form_active',
                'captcha_network_failed', 'captcha_http_error', 'captcha_http_success', 'captcha_yandex',
                'captcha_frame_visible', 'captcha_robot_checkbox_prompt', 'captcha_interactive_prompt',
                'captcha_error_text', 'captcha_checkbox_visible', 'captcha_input_visible', 'captcha_frame_inspection_failed',
                'submit_enabled', 'submit_enabled_before_fill', 'submit_enabled_after_fill',
                'credentials_filled', 'captcha_interaction_detected', 'credential_submit_once', 'profile_edit_loaded',
                'profile_identity_matches', 'header_identity_matches', 'captcha_visible', 'captcha_present');
              keys.push('home_trigger_success', 'register_trigger_success', 'home_some_click', 'register_some_click');
              for (const p of ['home','home_after','profile','register_after']) {
                keys.push(p + '_password_any_frame', p + '_password_dom', p + '_cross_origin_frame');
              }
              signals = keys.filter(k => typeof result.probe?.[k] === 'boolean')
                .map(k => k + '=' + (result.probe[k] ? '1' : '0')).join('; ');
            } catch (_) {}
            const url = context.serverUrl + '/' + context.repo.owner + '/' +
              context.repo.repo + '/actions/runs/' + context.runId;
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body: 'Sostav IndexResearch authentication check: **' + status +
                '**\n\nStage: ' + stage +
                '\n\nUI flags (booleans only): ' + signals +
                '\n\nWorkflow run: ' + url +
                '\n\nNo passwords, cookies or browser-session files were saved.',
            });

      - name: Fail if not verified
        if: always() && !contains(github.event.issue.body, '[AUTH-DIAG-NO-SECRETS]') && (steps.secrets.outputs.ready != 'yes' || steps.auth.outcome != 'success')
        run: exit 1
