name: One-time 3B public release acceptance
on:
  push:
    branches: ['feat/sector-methods-3b-2026-11-08']
    paths:
      - '.github/workflows/finalize-sector-3b.yml'
permissions:
  contents: write
  actions: read
  pull-requests: read
concurrency:
  group: gaeo-sector-3b-final-acceptance
  cancel-in-progress: false
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund && npx playwright install chromium
      - name: Diagnose public directory geometry without changing the site
        run: |
          node --input-type=module <<'JS'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('visual-sector-3b',{recursive:true});
          const browser=await chromium.launch({headless:true});
          const report=[];
          const inspect=page=>page.evaluate(()=>({width:innerWidth,document:document.documentElement.scrollWidth,elements:[...document.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return r.width>0&&(r.right>innerWidth+1||r.left< -1);}).map(e=>{const r=e.getBoundingClientRect(),s=getComputedStyle(e);return {tag:e.tagName,class:e.className,text:e.textContent.slice(0,180),left:r.left,right:r.right,width:r.width,scrollWidth:e.scrollWidth,clientWidth:e.clientWidth,display:s.display,minWidth:s.minWidth,maxWidth:s.maxWidth,whiteSpace:s.whiteSpace,overflowWrap:s.overflowWrap,wordBreak:s.wordBreak,fontSize:s.fontSize,padding:s.padding,grid:s.gridTemplateColumns};}).slice(0,35)}));
          for(const route of ['/strategies/','/en/strategies/']){
            const page=await browser.newPage({viewport:{width:320,height:1000},reducedMotion:'reduce'});
            await page.goto('https://gaeo.ru'+route,{waitUntil:'networkidle'});await page.evaluate(()=>document.fonts.ready);
            const before=await inspect(page);
            await page.screenshot({path:'visual-sector-3b/'+(route.startsWith('/en/')?'en':'ru')+'-before-320.jpg',type:'jpeg',quality:70,fullPage:true});
            const css='@media(max-width:760px){main .listing-grid{grid-template-columns:minmax(0,1fr)}main .list-card{min-width:0;overflow-wrap:anywhere}main .list-card .button,main .page-cta .button{max-width:100%;white-space:normal;box-sizing:border-box}main .listing-hero h1{overflow-wrap:anywhere}main .page-cta h2{overflow-wrap:anywhere}}';
            await page.addStyleTag({content:css});
            const after=await inspect(page);
            await page.screenshot({path:'visual-sector-3b/'+(route.startsWith('/en/')?'en':'ru')+'-candidate-320.jpg',type:'jpeg',quality:70,fullPage:true});
            report.push({route,before,after,css});
            console.log('DIRECTORY_DIAGNOSIS',JSON.stringify(report.at(-1)));
            await page.close();
          }
          await browser.close();fs.writeFileSync('visual-sector-3b/diagnosis.json',JSON.stringify(report,null,2)+'\n');
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sector-3b-directory-diagnosis
          path: visual-sector-3b/
          if-no-files-found: error
          retention-days: 14
