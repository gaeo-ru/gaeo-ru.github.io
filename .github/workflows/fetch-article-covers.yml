name: Fetch article covers from Tilda

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-article-covers.yml'

permissions:
  contents: write

jobs:
  fetch-covers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download article covers
        run: |
          mkdir -p assets/articles
          curl --fail --location --retry 3 'https://static.tildacdn.com/tild6663-3161-4366-b931-326364616464/019.jpg' --output assets/articles/neural-networks-for-business.jpg
          curl --fail --location --retry 3 'https://static.tildacdn.com/tild3934-3863-4137-b630-363663336362/024.jpg' --output assets/articles/personal-brand-expert.jpg
          curl --fail --location --retry 3 'https://static.tildacdn.com/tild6664-6331-4739-b932-303038316334/025.jpg' --output assets/articles/geo-sources-research.jpg
          curl --fail --location --retry 3 'https://static.tildacdn.com/tild3764-3536-4431-a633-323731393232/026.jpg' --output assets/articles/geo-real-estate.jpg
          test -s assets/articles/neural-networks-for-business.jpg
          test -s assets/articles/personal-brand-expert.jpg
          test -s assets/articles/geo-sources-research.jpg
          test -s assets/articles/geo-real-estate.jpg
          file assets/articles/*.jpg
      - name: Commit local article covers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/articles/*.jpg
          if git diff --cached --quiet; then
            echo "Article covers already up to date"
          else
            git commit -m "Store article covers locally"
            git push
          fi
