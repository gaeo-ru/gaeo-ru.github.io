name: Build GAEO social preview

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-social-preview.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Build 1200x630 fallback preview
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw, ImageFont

          W, H = 1200, 630
          bg = (2, 22, 65)
          cyan = (2, 229, 249)
          white = (255, 255, 255)
          muted = (203, 216, 233)

          im = Image.new("RGB", (W, H), bg)
          draw = ImageDraw.Draw(im)

          # Brand accent.
          draw.rounded_rectangle((72, 72, 88, H - 72), radius=8, fill=cyan)
          draw.rounded_rectangle((930, 72, 1128, 86), radius=7, fill=cyan)

          # GAEO icon.
          logo_path = Path("assets/gaeo-icon-512.png")
          logo = Image.open(logo_path).convert("RGBA")
          logo.thumbnail((190, 190), Image.Resampling.LANCZOS)
          logo_x, logo_y = 120, 168
          im.paste(logo, (logo_x, logo_y), logo)

          regular = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
          bold = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
          font_brand = ImageFont.truetype(bold, 76)
          font_tagline = ImageFont.truetype(bold, 38)
          font_sub = ImageFont.truetype(regular, 26)

          x = 370
          draw.text((x, 158), "GAEO.ru", font=font_brand, fill=white)
          draw.text((x, 270), "Generative & Answer", font=font_tagline, fill=cyan)
          draw.text((x, 320), "Engine Optimization", font=font_tagline, fill=cyan)
          draw.text((x, 405), "Alexey Yakovlev · GEO / AEO", font=font_sub, fill=muted)

          # Small descriptor, intentionally language-neutral.
          draw.text((120, 522), "AI visibility · search · content · reputation", font=font_sub, fill=muted)

          out = Path("assets/gaeo-social-preview.jpg")
          im.save(out, "JPEG", quality=90, optimize=True, progressive=True)
          print(f"Created {out}: {im.size[0]}x{im.size[1]}, {out.stat().st_size} bytes")
          PY
      - name: Commit preview asset
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/gaeo-social-preview.jpg
          if git diff --cached --quiet; then
            echo "No social preview changes."
            exit 0
          fi
          git commit -m "Add branded GAEO social preview"
          git pull --rebase origin main
          git push origin HEAD:main
