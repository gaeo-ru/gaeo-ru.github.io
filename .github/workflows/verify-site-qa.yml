name: Verify GAEO site QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-site-qa.yml"

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run staging QA
        run: python scripts/site_qa.py --mode staging
