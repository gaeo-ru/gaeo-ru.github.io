name: DNS migration snapshot

on:
  push:
    paths:
      - ".github/workflows/dns-migration-snapshot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install DNS tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils

      - name: Query GAEO DNS
        shell: bash
        run: |
          set -euo pipefail
          q() {
            local name="$1"
            local type="$2"
            echo
            echo "===== $name $type ====="
            dig +noall +answer "$name" "$type" || true
          }

          q gaeo.ru A
          q gaeo.ru AAAA
          q gaeo.ru NS
          q gaeo.ru SOA
          q gaeo.ru MX
          q gaeo.ru TXT
          q gaeo.ru CAA

          q www.gaeo.ru A
          q www.gaeo.ru AAAA
          q www.gaeo.ru CNAME

          q _dmarc.gaeo.ru TXT
          q mail._domainkey.gaeo.ru TXT

          q forms.gaeo.ru A
          q forms.gaeo.ru AAAA
          q forms.gaeo.ru CNAME

          q _github-pages-challenge-gaeo-ru.gaeo.ru TXT

      - name: Inspect GitHub Pages settings
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          echo
          echo "===== GITHUB PAGES SETTINGS ====="
          gh api "repos/${GITHUB_REPOSITORY}/pages" \
            --jq '{url:.html_url,cname:.cname,https_enforced:.https_enforced,build_type:.build_type,source:.source,status:.status}'

          echo
          echo "===== LATEST PAGES BUILD ====="
          for attempt in {1..18}; do
            state="$(gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" --jq '.status' 2>/dev/null || echo unknown)"
            echo "Pages build state: $state (attempt $attempt/18)"
            if [ "$state" != "building" ] && [ "$state" != "queued" ]; then
              break
            fi
            sleep 10
          done
          gh api "repos/${GITHUB_REPOSITORY}/pages/builds/latest" \
            --jq '{status:.status,error:.error,message:.error.message,commit:.commit,created_at:.created_at,updated_at:.updated_at}' || true

          echo
          echo "===== GITHUB PAGES SETTINGS AFTER BUILD ====="
          gh api "repos/${GITHUB_REPOSITORY}/pages" \
            --jq '{url:.html_url,cname:.cname,https_enforced:.https_enforced,build_type:.build_type,source:.source,status:.status}'
