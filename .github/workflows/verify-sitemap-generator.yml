name: Verify sitemap generator

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-sitemap-generator.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build staging preview sitemap outside repository
        shell: bash
        run: |
          set -euo pipefail
          python scripts/build_sitemap.py --preview-staging --output /tmp/gaeo-sitemap.xml
          test -s /tmp/gaeo-sitemap.xml
          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          p = Path("/tmp/gaeo-sitemap.xml")
          root = ET.parse(p).getroot()
          ns = {"sm": "http://www.sitemaps.org/schemas/sitemap/0.9"}
          urls = [el.text for el in root.findall("sm:url/sm:loc", ns)]
          lastmods = [el.text for el in root.findall("sm:url/sm:lastmod", ns)]

          assert urls, "Preview sitemap is empty"
          assert len(urls) == len(set(urls)), "Duplicate sitemap URLs"
          assert all(u.startswith("https://gaeo.ru/") for u in urls), "Non-production URL found"
          assert not any("gaeo-ru.github.io" in u for u in urls), "Staging URL found"
          assert "https://gaeo.ru/404.html" not in urls, "404 page must be excluded"
          assert "https://gaeo.ru/privacy-policy/" not in urls, "RU legal noindex page must be excluded"
          assert "https://gaeo.ru/personal-data-consent/" not in urls, "RU consent noindex page must be excluded"
          assert "https://gaeo.ru/en/privacy-policy/" not in urls, "EN legal noindex page must be excluded"
          assert "https://gaeo.ru/en/personal-data-consent/" not in urls, "EN consent noindex page must be excluded"
          assert all(x and len(x) == 10 for x in lastmods), "Invalid lastmod"

          print(f"PREVIEW_SITEMAP_URLS={len(urls)}")
          for u in urls:
              print("SITEMAP_URL", u)
          print("SITEMAP_XML_PARSE=PASS")
          print("SITEMAP_PRODUCTION_URLS_ONLY=PASS")
          print("SITEMAP_EXCLUSIONS=PASS")
          PY
          test ! -e sitemap.xml
          echo "STAGING_SITEMAP_NOT_PUBLISHED=PASS"
