name: Public QA cache and IndexNow key

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/public-cache-indexnow-qa.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Wait for public Pages
        run: sleep 20

      - name: Verify public assets and key
        shell: bash
        run: |
          set -euo pipefail
          base="https://gaeo-ru.github.io"
          style="$(sha256sum assets/style.css | cut -c1-12)"
          internal="$(sha256sum assets/internal.css | cut -c1-12)"
          sitejs="$(sha256sum assets/site.js | cut -c1-12)"
          curl -fsS "$base/" -o home.html
          grep -q "/assets/style.css?v=$style" home.html
          grep -q "/assets/internal.css?v=$internal" home.html
          grep -q "/assets/site.js?v=$sitejs" home.html
          curl -fsS "$base/assets/style.css?v=$style" -o style.css
          curl -fsS "$base/assets/internal.css?v=$internal" -o internal.css
          curl -fsS "$base/assets/site.js?v=$sitejs" -o site.js
          curl -fsS "$base/da791ac7b06753005d91601fa2c3a20fbf4be51db4dab804fa3a82d6335a229e.txt" -o key.txt
          test -s style.css
          test -s internal.css
          test -s site.js
          test "$(tr -d '[:space:]' < key.txt)" = "da791ac7b06753005d91601fa2c3a20fbf4be51db4dab804fa3a82d6335a229e"
          echo "PUBLIC_HASH_ASSETS=PASS"
          echo "PUBLIC_INDEXNOW_KEY=PASS"

      - name: Capture desktop and mobile
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=1440,900 --screenshot=home-desktop.png "https://gaeo-ru.github.io/"
          "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars --window-size=390,844 --screenshot=home-mobile.png "https://gaeo-ru.github.io/"
          file home-desktop.png home-mobile.png

      - uses: actions/upload-artifact@v4
        with:
          name: public-cache-indexnow-qa
          path: |
            home-desktop.png
            home-mobile.png
          if-no-files-found: error
