name: Fetch biography photo from Tilda

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fetch-biography-photo.yml'

permissions:
  contents: write

jobs:
  fetch-photo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download original biography photo from Tilda
        run: |
          mkdir -p assets
          curl --fail --location --retry 3             'https://static.tildacdn.com/tild6633-6130-4764-b231-633662643062/006.jpg'             --output assets/alexey-yakovlev-biography.jpg
          test -s assets/alexey-yakovlev-biography.jpg
          file assets/alexey-yakovlev-biography.jpg
      - name: Commit local copy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/alexey-yakovlev-biography.jpg
          if git diff --cached --quiet; then
            echo "Photo already up to date"
          else
            git commit -m "Store biography photo locally"
            git push
          fi
