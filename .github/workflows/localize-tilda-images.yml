name: Localize Tilda images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/localize-tilda-images.yml"\n      - "scripts/localize_tilda_images.py"

permissions:
  contents: write

jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Localize images
        run: python scripts/localize_tilda_images.py
      - name: Commit localized assets and references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Localize remaining Tilda CDN images"
          git pull --rebase origin main
          git push origin HEAD:main
