name: GAEO independent public HTTPS review phase 3A automotive finance

on:
  push:
    branches:
      - 'qa/sector-3a-live-*'
      - astro-source
    paths:
      - 'scripts/qa_sector_public_live_3a.mjs'
      - '.github/workflows/sector-3a-live-qa.yml'
  pull_request:
    branches: [astro-source]
    paths:
      - 'scripts/qa_sector_public_live_3a.mjs'
      - '.github/workflows/sector-3a-live-qa.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gaeo-sector-3a-public-post-pages-2026-11-09
  cancel-in-progress: false

jobs:
  public-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout canonical source
        uses: actions/checkout@v4
      - name: Checkout current published main (read only)
        uses: actions/checkout@v4
        with:
          ref: main
          path: published-main
      - name: Record exact source and published revisions
        shell: bash
        run: |
          echo "PUBLISHED_MAIN_SHA=$(git -C published-main rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "Source SHA: $(git rev-parse HEAD)"
          echo "Published main SHA: $(git -C published-main rev-parse HEAD)"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser QA dependencies
        run: |
          npm install --no-audit --no-fund
          npx playwright install chromium
      - name: Verify public HTTPS / main checksum / 1440 390 320 Chromium
        env:
          GAEO_PUBLIC_ORIGIN: https://gaeo.ru
        run: node scripts/qa_sector_public_live_3a.mjs
      - name: Retain acceptance report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gaeo-sector-3a-public-live
          path: visual-sector-3a-live/
          if-no-files-found: warn
          retention-days: 21
