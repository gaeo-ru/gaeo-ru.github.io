name: Sync shared chrome and rerun QA

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-chrome-qa.yml"

permissions:
  contents: write

jobs:
  sync-and-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync latest main
        run: git pull --rebase origin main
      - name: Synchronize RU and EN shared chrome
        run: python scripts/ensure_site_chrome.py
      - name: Commit synchronized HTML
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html' '**/*.html'
          if git diff --cached --quiet; then
            echo "No shared chrome changes."
          else
            git commit -m "Synchronize bilingual shared site chrome"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
      - name: Run staging QA after synchronization
        run: python scripts/site_qa.py --mode staging
