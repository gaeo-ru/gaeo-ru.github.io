name: Verify no-JS semantic content
# Final visual recheck after mobile nav fallback polish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/verify-nojs.yml"
      - "templates/partials/nojs-fallback.html"
      - "templates/partials/site-header.html"
      - "templates/partials/site-header-en.html"
      - "scripts/ensure_site_chrome.py"
      - "scripts/site_qa.py"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Selenium
        run: python -m pip install --disable-pip-version-check selenium

      - name: Wait for public no-JS fallback
        shell: bash
        run: |
          set -euo pipefail
          base="https://gaeo-ru.github.io"
          ready=0
          for attempt in $(seq 1 24); do
            curl -fsS "$base/" -o /tmp/home-source.html || true
            if grep -q '<noscript>' /tmp/home-source.html               && grep -q 'mobile-menu{display:block!important' /tmp/home-source.html               && grep -q 'cards.mobile-fold-body{display:grid!important' /tmp/home-source.html; then
              ready=1
              echo "Public Pages reached no-JS fallback on attempt $attempt."
              break
            fi
            sleep 10
          done
          test "$ready" = "1"

      - name: Verify public pages with JavaScript blocked in Chrome
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p shots
          python - <<'PY'
          from pathlib import Path
          from html import unescape
          import re
          import time

          from selenium import webdriver
          from selenium.webdriver.common.by import By
          from selenium.webdriver.common.keys import Keys
          from selenium.webdriver.chrome.options import Options

          BASE = "https://gaeo-ru.github.io"

          options = Options()
          options.add_argument("--headless=new")
          options.add_argument("--no-sandbox")
          options.add_argument("--disable-gpu")
          options.add_argument("--hide-scrollbars")
          options.add_argument("--window-size=1440,1000")
          options.add_experimental_option(
              "prefs",
              {
                  "profile.default_content_setting_values.javascript": 2,
                  "profile.managed_default_content_settings.javascript": 2,
              },
          )

          driver = webdriver.Chrome(options=options)
          driver.set_page_load_timeout(60)

          try:
              # Prove the browser profile really blocks page JavaScript.
              check = Path("/tmp/js-check.html")
              check.write_text(
                  '<!doctype html><html><body data-js="off">JS disabled'
                  '<script>document.body.setAttribute("data-js","on");</script>'
                  '</body></html>',
                  encoding="utf-8",
              )
              driver.get(check.as_uri())
              assert driver.find_element(By.TAG_NAME, "body").get_attribute("data-js") == "off"
              print("JAVASCRIPT_DISABLED=PASS")

              pages = {
                  "home-ru": "/",
                  "home-en": "/en/",
                  "articles": "/articles/",
                  "article": "/articles/kakie-istochniki-ispolzuyut-neyroseti-pri-vybore-geo-specialistov/",
                  "cases": "/cases/",
                  "case": "/cases/prep-center-6-klientov-iz-neyrosetey/",
                  "biography": "/professional-biography/",
                  "commercial": "/geo-prodvizhenie-nedvizhimosti/",
              }

              sources = {}
              for name, route in pages.items():
                  driver.set_window_size(1440, 1000)
                  driver.get(BASE + route)
                  time.sleep(0.5)
                  sources[name] = driver.page_source

                  h1 = driver.find_elements(By.TAG_NAME, "h1")
                  assert len(h1) == 1 and h1[0].text.strip(), (name, "H1")
                  main = driver.find_element(By.TAG_NAME, "main")
                  assert len(main.text.strip()) >= 120, (name, "text")
                  assert driver.find_elements(By.CSS_SELECTOR, "a[href]"), (name, "links")
                  assert driver.find_elements(By.CSS_SELECTOR, 'a[href="mailto:ya@gaeo.ru"]'), (name, "email")
                  assert driver.find_elements(By.CSS_SELECTOR, 'a[href="tel:+79264242333"]'), (name, "phone")

              # Homepage: all semantic catalogue blocks remain in source HTML.
              for name in ("home-ru", "home-en"):
                  text = sources[name]
                  assert len(re.findall(r'<details\b[^>]*class=["\'][^"\']*\bprice\b', text, re.I)) >= 3
                  assert len(re.findall(r'<details\b[^>]*class=["\'][^"\']*\bfaq-item\b', text, re.I)) >= 5
              assert len(re.findall(r'class=["\'][^"\']*\bmobile-fold-body\b', sources["home-ru"], re.I)) >= 2

              assert len(re.findall(r"<article\b", sources["articles"], re.I)) >= 1
              assert len(re.findall(r"<article\b", sources["cases"], re.I)) >= 1
              assert len(re.findall(r'<details\b[^>]*class=["\'][^"\']*\bfaq-item\b', sources["commercial"], re.I)) >= 5

              # Mobile no-JS fallback: navigation and folded content must be visible without script.
              driver.set_window_size(390, 1800)
              driver.get(BASE + "/")
              time.sleep(0.5)
              desktop_menu = driver.find_element(By.ID, "desktopMenu")
              assert not desktop_menu.is_displayed(), "desktop navigation remains visible in mobile no-JS mode"
              mobile_menu = driver.find_element(By.ID, "mobileMenu")
              assert mobile_menu.is_displayed(), "mobile no-JS menu is hidden"
              toggle = driver.find_element(By.CSS_SELECTOR, ".menu-toggle")
              assert not toggle.is_displayed(), "dead mobile burger remains visible"
              fold_bodies = driver.find_elements(By.CSS_SELECTOR, ".mobile-fold-body")
              assert len(fold_bodies) >= 2
              assert all(el.is_displayed() for el in fold_bodies), "mobile-fold content is hidden without JS"

              # Native HTML details must still open with JavaScript blocked.
              first_price = driver.find_element(By.CSS_SELECTOR, "details.price")
              assert first_price.get_attribute("open") is None
              first_price.find_element(By.TAG_NAME, "summary").send_keys(Keys.ENTER)
              assert first_price.get_attribute("open") is not None

              first_faq = driver.find_element(By.CSS_SELECTOR, "details.faq-item")
              assert first_faq.get_attribute("open") is None
              first_faq.find_element(By.TAG_NAME, "summary").send_keys(Keys.ENTER)
              assert first_faq.get_attribute("open") is not None

              print("NOJS_H1=PASS")
              print("NOJS_TEXT=PASS")
              print("NOJS_ARTICLES=PASS")
              print("NOJS_CASES=PASS")
              print("NOJS_FAQ=PASS")
              print("NOJS_PRICING=PASS")
              print("NOJS_CONTACTS=PASS")
              print("NOJS_LINKS=PASS")
              print("NOJS_MOBILE_NAV=PASS")
              print("NOJS_NATIVE_DETAILS=PASS")

              shots = [
                  ("home-desktop", 1440, 1000, "/"),
                  ("home-mobile", 390, 1800, "/"),
                  ("article-desktop", 1440, 1000, pages["article"]),
                  ("article-mobile", 390, 1500, pages["article"]),
                  ("case-desktop", 1440, 1000, pages["case"]),
                  ("case-mobile", 390, 1500, pages["case"]),
                  ("biography-mobile", 390, 1500, pages["biography"]),
                  ("commercial-mobile", 390, 1800, pages["commercial"]),
              ]
              for name, width, height, route in shots:
                  driver.set_window_size(width, height)
                  driver.get(BASE + route)
                  time.sleep(0.5)
                  driver.save_screenshot(f"shots/{name}.png")
          finally:
              driver.quit()
          PY

      - name: Check screenshots
        run: file shots/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: nojs-semantic-qa
          path: shots/*.png
          if-no-files-found: error
