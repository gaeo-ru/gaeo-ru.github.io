name: Build Astro and safely publish to GAEO.ru
on:
  push:
    branches: [astro-source]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: write
concurrency:
  group: gaeo-astro-source-publishing
  cancel-in-progress: false
jobs:
  build-verify-publish:
    if: github.ref == 'refs/heads/astro-source'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check GAEO editorial rules
        run: node scripts/qa_editorial_contrasts.mjs
      - name: Install and build Astro source
        run: |
          npm install --no-audit --no-fund
          npm run build
          npm run check:parity
          npm run check:entities
          npm run check:anchors
          npm run check:design
          npm run check:rankings
          node scripts/qa_rankings_queue.mjs
      - name: Check e-commerce article, methodology, and conversion links
        run: node scripts/qa_ecommerce_link_graph.mjs
      - name: Validate legal GEO pages and cross-links
        run: node scripts/qa_legal_link_graph.mjs
      - name: Validate industrial B2B GEO pages and source evidence
        run: node scripts/qa_industrial_link_graph.mjs
      - name: Install Chromium for industry landing browser QA
        run: npx playwright install chromium
      - name: Verify bilingual rankings, images and FAQ at desktop and mobile widths
        run: node scripts/qa_rankings.mjs --browser
      - name: Verify publications, reviews and carousel
        run: npm run check:evidence
      - name: Verify pricing, catalogue, calculator and inquiry handoff
        run: npm run check:tariffs
      - name: Check industry landings at desktop and mobile widths
        run: npm run check:industry
      - name: Check four bilingual industry specializations and incoming links
        run: npm run check:specializations
      - name: Check phase 3A automotive and finance GEO hubs and methods
        run: npm run check:sector3a
      - name: Check phase 3C editorial checklists and industry link graph
        run: npm run check:sector3c
      - name: Check phase 3D sector case evidence and link graph
        run: npm run check:sector3d
      - name: Check phase 3E buyer-intent guides and commercial-page links
        run: npm run check:sector3e
      - name: Check bilingual website development cases
        run: node scripts/qa_development_cases.mjs
      - name: Check GEO website development service pages and navigation
        run: node scripts/qa_site_development_service.mjs
      - name: Verify bilingual research article responsive layout
        run: npm run check:research
      - name: Verify narrow labels in mobile scrollable tables across site
        run: node scripts/qa_mobile_scroll_tables.mjs
      - name: Reconcile generated Astro output with production-maintained metadata
        run: |
          set -euo pipefail
          # main's maintenance job normalizes the published HTML. Do the same
          # on the Astro build before the parallel-edit protection compares hashes.
          # These helpers are staging-only and never enter the published files list.
          mkdir -p dist/scripts dist/templates
          cp scripts/*.py dist/scripts/
          cp -R templates/partials dist/templates/
          cp SITE_MODE robots.production.txt MIGRATION_URL_MAP.md dist/
          (
            cd dist
            python scripts/ensure_indexability.py
            python scripts/ensure_site_chrome.py
            python scripts/ensure_hub_cta.py
            python scripts/ensure_font_loading.py
            python scripts/ensure_site_metadata.py
            python scripts/ensure_article_dates.py
            python scripts/ensure_social_preview.py
            python scripts/ensure_analytics.py
            python scripts/ensure_form_config.py
            python scripts/ensure_asset_versions.py
            # Metadata normalization changes dates/schema: regenerate the exact sitemap
            # tested by site_qa rather than checking the pre-normalized Astro sitemap.
            python scripts/build_sitemap.py > /dev/null
            python scripts/site_qa.py --mode production
          )
          python -m unittest discover -s tests -p 'test_ensure_site_metadata.py'
      - name: Check out existing public GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: published
          fetch-depth: 0
          persist-credentials: true
      - name: Prevent overwriting parallel changes on main
        id: safety
        run: node scripts/publish-astro-to-main.mjs preflight
      - name: Install browser for first release
        if: steps.safety.outputs.initial == 'true'
        run: npx playwright install chromium
      - name: Pixel-compare with production before first release
        if: steps.safety.outputs.initial == 'true'
        run: npm run check:visual
      - name: Copy checked Astro build to published branch
        run: node scripts/publish-astro-to-main.mjs publish
      - name: Synchronize canonical navigation and QA rules for production validation
        run: |
          cp templates/partials/site-header.html published/templates/partials/site-header.html
          cp templates/partials/site-header-en.html published/templates/partials/site-header-en.html
          cp templates/partials/site-footer.html published/templates/partials/site-footer.html
          cp templates/partials/site-footer-en.html published/templates/partials/site-footer-en.html
          cp scripts/site_qa.py published/scripts/site_qa.py
      - name: Run existing GAEO production QA on generated pages
        working-directory: published
        run: python scripts/site_qa.py --mode production
      - name: Commit and publish generated HTML/assets only
        id: commit
        working-directory: published
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- '*.html' assets/ '_astro/' gaeo-services.yml.xml robots.txt sitemap.xml CNAME favicon.ico '.nojekyll' 'astro-release-manifest.json' templates/partials/site-header.html templates/partials/site-header-en.html templates/partials/site-footer.html templates/partials/site-footer-en.html scripts/site_qa.py
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Site content is already exactly published."
            exit 0
          fi
          git commit -m "Publish verified Astro build to GAEO.ru"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Request branch-based GitHub Pages build
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for i in {1..8}; do
            if gh api --method POST "repos/${GITHUB_REPOSITORY}/pages/builds" >/dev/null; then
              echo "GitHub Pages build requested."
              exit 0
            fi
            sleep 10
          done
          echo "Astro output committed; Pages build request needs retry."
          exit 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: astro-cutover-evidence
          path: |
            visual-evidence/
            visual-parity/
            visual-industry/
            visual-research/
            visual-mobile-tables/
            visual-tariffs/
            visual-hub-funnel/
            visual-rankings/
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaeo-phase4b-link-matrix-json
          path: visual-hub-funnel/gaeo-phase4b-link-matrix.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaeo-phase4b-evidence-readiness-json
          path: visual-hub-funnel/gaeo-phase4b-evidence.json
          if-no-files-found: ignore
          retention-days: 14
