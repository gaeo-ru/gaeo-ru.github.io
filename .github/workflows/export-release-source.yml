name: Export release audit source
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/export-release-source.yml']
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Package tracked source for local release verification
        run: git archive --format=tar HEAD > /tmp/gaeo-release-source.tar
      - uses: actions/upload-artifact@v4
        with:
          name: gaeo-release-source
          path: /tmp/gaeo-release-source.tar
          retention-days: 3
