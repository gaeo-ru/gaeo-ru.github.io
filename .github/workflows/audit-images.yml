name: Audit local images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-images.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Audit images and HTML image attributes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          import re

          print("=== IMAGE FILES ===")
          for p in sorted(Path(".").rglob("*")):
              if not p.is_file() or p.suffix.lower() not in {".jpg",".jpeg",".png",".webp",".avif",".gif"}:
                  continue
              try:
                  with Image.open(p) as im:
                      print(f"{p}\t{im.width}x{im.height}\t{p.stat().st_size}\t{im.format}\t{im.mode}")
              except Exception as e:
                  print(f"ERROR\t{p}\t{e}")

          print("=== HTML IMG TAG AUDIT ===")
          totals = dict(tags=0, local=0, missing_alt=0, missing_width=0, missing_height=0, missing_loading=0, missing_decoding=0)
          for p in sorted(list(Path(".").rglob("*.html")) + list(Path(".").rglob("*.html.template"))):
              text = p.read_text(encoding="utf-8")
              rows=[]
              for m in re.finditer(r"<img\b[^>]*>", text, re.I|re.S):
                  tag=m.group(0)
                  totals["tags"] += 1
                  sm=re.search(r'\bsrc=["\']([^"\']+)["\']',tag,re.I)
                  src=sm.group(1) if sm else ""
                  if not src.startswith("/assets/"):
                      continue
                  totals["local"] += 1
                  missing=[]
                  if not re.search(r'\balt=["\'][^"\']*["\']',tag,re.I): totals["missing_alt"]+=1; missing.append("alt")
                  if not re.search(r'\bwidth=["\']?\d+',tag,re.I): totals["missing_width"]+=1; missing.append("width")
                  if not re.search(r'\bheight=["\']?\d+',tag,re.I): totals["missing_height"]+=1; missing.append("height")
                  if not re.search(r'\bloading=["\'](?:lazy|eager)["\']',tag,re.I): totals["missing_loading"]+=1; missing.append("loading")
                  if not re.search(r'\bdecoding=["\'](?:async|sync|auto)["\']',tag,re.I): totals["missing_decoding"]+=1; missing.append("decoding")
                  if missing:
                      rows.append((src, ",".join(missing), re.sub(r"\s+"," ",tag)[:300]))
              if rows:
                  print(f"FILE\t{p}")
                  for row in rows:
                      print("TAG\t" + "\t".join(row))
          print("TOTALS\t" + "\t".join(f"{k}={v}" for k,v in totals.items()))
          PY
