name: Visual QA shared chrome

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/visual-qa-chrome.yml"

permissions:
  contents: read

jobs:
  capture:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for Pages propagation
        run: sleep 25

      - name: Capture representative RU/EN desktop and mobile pages
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium)"
          mkdir -p shots
          base="https://gaeo-ru.github.io"
          capture() {
            local name="$1"
            local width="$2"
            local height="$3"
            local url="$4"
            "$browser" --headless --no-sandbox --disable-gpu --hide-scrollbars               --window-size="${width},${height}"               --screenshot="shots/${name}.png" "$url"
          }
          capture home-ru-desktop 1440 900 "$base/"
          capture home-ru-mobile 390 844 "$base/"
          capture home-en-desktop 1440 900 "$base/en/"
          capture home-en-mobile 390 844 "$base/en/"
          capture articles-ru-desktop 1440 900 "$base/articles/"
          capture articles-ru-mobile 390 844 "$base/articles/"
          capture articles-en-desktop 1440 900 "$base/en/articles/"
          capture articles-en-mobile 390 844 "$base/en/articles/"
          file shots/*.png

      - uses: actions/upload-artifact@v4
        with:
          name: shared-chrome-visual-qa
          path: shots/*.png
          if-no-files-found: error
