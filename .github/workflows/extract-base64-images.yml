name: Extract Base64 images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/extract-base64-images.yml"
      - "scripts/extract_base64_images.py"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Sync main
        run: git pull --rebase origin main
      - name: Extract Base64 images
        run: python scripts/extract_base64_images.py
      - name: Commit extracted assets and HTML replacements
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "Extract Base64 images into assets"
          git pull --rebase origin main
          git push origin HEAD:main
